name: Build AMEX NET VPN APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XRAY_VERSION: v1.8.24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Fetch tun2socks (hev-socks5-tunnel)
        run: git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel

      - name: Fetch Xray core (arm64 + arm32)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          curl -fsSL "$base/Xray-android-arm64-v8a.zip" -o x64.zip || curl -fsSL "$base/Xray-linux-arm64-v8a.zip" -o x64.zip
          curl -fsSL "$base/Xray-linux-arm32-v7a.zip" -o x32.zip
          unzip -p x64.zip xray > app/src/main/jniLibs/arm64-v8a/libxray.so
          unzip -p x32.zip xray > app/src/main/jniLibs/armeabi-v7a/libxray.so
          chmod 755 app/src/main/jniLibs/*/libxray.so

      # Keeps the same signing key between runs so new APKs install over old ones
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: amex-debug-keystore-v1

      - name: Optional release keystore (repo secrets)
        env:
          KS_B64: ${{ secrets.AMEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/amex.jks"
            echo "AMEX_KEYSTORE=$RUNNER_TEMP/amex.jks" >> "$GITHUB_ENV"
            echo "AMEX_KS_PASS=${{ secrets.AMEX_KS_PASS }}" >> "$GITHUB_ENV"
            echo "AMEX_KEY_ALIAS=${{ secrets.AMEX_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "AMEX_KEY_PASS=${{ secrets.AMEX_KEY_PASS }}" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AMEX-NET-VPN-apk
          path: app/build/outputs/apk/release/*.apk
