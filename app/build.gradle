plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ksPath = System.getenv("AMEX_KEYSTORE")

android {
    namespace 'com.amexnet.vpn'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.amexnet.vpn"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // Both 32-bit and 64-bit ARM, one universal APK
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("AMEX_KS_PASS")
                keyAlias System.getenv("AMEX_KEY_ALIAS")
                keyPassword System.getenv("AMEX_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }

    externalNativeBuild {
        ndkBuild { path "src/main/jni/Android.mk" }
    }

    packaging {
        jniLibs {
            // libxray.so is an executable we launch from nativeLibraryDir, so it must be extracted
            useLegacyPackaging = true
            keepDebugSymbols.add("**/libxray.so")
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.github.mwiede:jsch:0.2.18'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
